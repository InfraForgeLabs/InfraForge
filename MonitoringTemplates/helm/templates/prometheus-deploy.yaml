# ===============================
# Prometheus Deployment (Helm Template)
# ===============================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-prometheus
  namespace: {{ .Release.Namespace }}
  labels:
    app: prometheus
spec:
  replicas: {{ .Values.prometheus.replicas | default 1 }}
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - name: prometheus
        image: {{ .Values.prometheus.image }}
        args:
        - "--config.file=/etc/prometheus/prometheus.yml"
        ports:
        - containerPort: {{ .Values.prometheus.port | default 9090 }}

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{APP_NAME}}-rolebinding
  namespace: {{NAMESPACE}}
subjects:
  - kind: ServiceAccount
    name: {{APP_NAME}}
    namespace: {{NAMESPACE}}
roleRef:
  kind: Role
  name: {{APP_NAME}}-role
  apiGroup: rbac.authorization.k8s.io

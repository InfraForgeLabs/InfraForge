apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{APP_NAME}}
  namespace: argocd
spec:
  project: {{PROJECT}}
  source:
    repoURL: {{REPO_URL}}
    targetRevision: {{BRANCH}}
    path: manifests/{{APP_NAME}}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{NAMESPACE}}

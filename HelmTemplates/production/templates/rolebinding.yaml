apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{APP_NAME}}-rolebinding
  namespace: {{NAMESPACE}}
  labels:
    app: {{APP_NAME}}
subjects:
  - kind: ServiceAccount
    name: {{APP_NAME}}-sa
    namespace: {{NAMESPACE}}
roleRef:
  kind: Role
  name: {{APP_NAME}}-role
  apiGroup: rbac.authorization.k8s.io

---
- name: Ensure UFW is installed
  apt:
    name: ufw
    state: present

- name: Enable UFW with default rules
  ufw:
    state: enabled
    policy: deny
    rule: allow
    port: 22
    proto: tcp

- name: Ensure SSH root login is disabled
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^PermitRootLogin'
    line: 'PermitRootLogin no'
  notify: Restart SSH

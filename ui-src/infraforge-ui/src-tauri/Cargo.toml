[package]
name = "infraforge"
version = "0.1.0"
description = "InfraForge Desktop"
authors = ["InfraForgeLabs"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.9.5" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.19"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.11", features = ["blocking", "json"] }
url = "2.5"
flate2 = "1.0"
tar = "0.4"
similar = "2.5"

[features]
custom-protocol = ["tauri/custom-protocol"]

apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{APP_NAME}}-cron
  namespace: {{NAMESPACE}}
  labels:
    app: {{APP_NAME}}
spec:
  schedule: "0 */6 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: {{APP_NAME}}-cron
              image: {{IMAGE}}
              args: ["echo", "Running scheduled maintenance task"]

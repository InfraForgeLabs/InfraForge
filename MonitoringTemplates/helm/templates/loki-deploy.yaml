# ===============================
# Loki Deployment (Helm Template)
# ===============================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-loki
  namespace: {{ .Release.Namespace }}
  labels:
    app: loki
spec:
  replicas: {{ .Values.loki.replicas | default 1 }}
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
      - name: loki
        image: {{ .Values.loki.image }}
        args: ["-config.file=/etc/loki/config.yaml"]
        ports:
        - containerPort: {{ .Values.loki.port | default 3100 }}

# ===============================
# Grafana Deployment (Helm Template)
# ===============================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-grafana
  namespace: {{ .Release.Namespace }}
  labels:
    app: grafana
spec:
  replicas: {{ .Values.grafana.replicas | default 1 }}
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: {{ .Values.grafana.image }}
        ports:
        - containerPort: {{ .Values.grafana.port | default 3000 }}
        env:
          - name: GF_SECURITY_ADMIN_USER
            value: "{{ .Values.grafana.adminUser }}"
          - name: GF_SECURITY_ADMIN_PASSWORD
            value: "{{ .Values.grafana.adminPassword }}"

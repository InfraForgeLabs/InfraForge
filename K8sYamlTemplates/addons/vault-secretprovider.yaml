apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{APP_NAME}}-vault
  namespace: {{NAMESPACE}}
spec:
  provider: vault
  parameters:
    roleName: "{{APP_NAME}}-role"
    vaultAddress: "https://vault.example.com"
    objects: |
      - objectName: "{{APP_NAME}}-secret"
        secretPath: "secret/data/{{APP_NAME}}"
        secretKey: "password"

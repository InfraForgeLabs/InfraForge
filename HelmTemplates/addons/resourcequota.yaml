apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{APP_NAME}}-quota
  namespace: {{NAMESPACE}}
  labels:
    app: {{APP_NAME}}
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
    pods: "10"
    configmaps: "5"
    persistentvolumeclaims: "5"
    secrets: "10"
    services: "5"

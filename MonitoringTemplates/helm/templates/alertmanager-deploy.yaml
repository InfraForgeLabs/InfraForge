# ===============================
# Alertmanager Deployment (Helm Template)
# ===============================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-alertmanager
  namespace: {{ .Release.Namespace }}
  labels:
    app: alertmanager
spec:
  replicas: {{ .Values.alertmanager.replicas }}
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
      - name: alertmanager
        image: {{ .Values.alertmanager.image }}
        args: ["--config.file=/etc/alertmanager/config.yaml"]
        ports:
        - containerPort: {{ .Values.alertmanager.port | default 9093 }}

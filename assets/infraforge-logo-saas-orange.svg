<svg
  width="960"
  height="220"
  viewBox="0 0 960 220"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="InfraForge"
>
  <defs>
    <!-- SaaS Orange gradient -->
    <linearGradient id="saasOrange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFB347"/>
      <stop offset="50%" stop-color="#FF8C42"/>
      <stop offset="100%" stop-color="#FF6F00"/>
    </linearGradient>

    <!-- Soft highlight -->
    <linearGradient id="saasHighlightOrange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0.05)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.0)"/>
    </linearGradient>
  </defs>

  <text
    x="50%"
    y="54%"
    text-anchor="middle"
    dominant-baseline="middle"
    font-size="140"
    font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
    font-weight="700"
    fill="url(#saasOrange)"
    letter-spacing="-2.5"
  >
    InfraForge
  </text>

  <text
    x="50%"
    y="54%"
    text-anchor="middle"
    dominant-baseline="middle"
    font-size="140"
    font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
    font-weight="700"
    fill="url(#saasHighlightOrange)"
    letter-spacing="-2.5"
  >
    InfraForge
  </text>
</svg>

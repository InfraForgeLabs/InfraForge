#!/bin/bash
REPO_URL="https://raw.githubusercontent.com/gauravchile/DevopsTemplates/main/K8sYamlTemplates"
SCRIPT_NAME="k8s-yaml-gen.sh"
OUT_DIR="generated"
CACHE_DIR=".cache/k8s-yaml-gen"
mkdir -p "$OUT_DIR" "$CACHE_DIR"

VERSION="v8.0"
DATE=$(date +"%Y-%m-%d %H:%M:%S")

# --- Colors & Logging ---
timestamp() { date +"%H:%M:%S"; }
info()    { echo -e "\033[1;34m[$(timestamp)] $1\033[0m"; }
success() { echo -e "\033[1;32m[$(timestamp)] $1\033[0m"; }
warn()    { echo -e "\033[1;33m[$(timestamp)] $1\033[0m"; }
error()   { echo -e "\033[1;31m[$(timestamp)] $1\033[0m"; }

# --- CLI Arguments ---
while [[ "$#" -gt 0 ]]; do
  case $1 in
    --mode) MODE="$2"; shift ;;
    --resource) RESOURCE="$2"; shift ;;
    --app) APP="$2"; shift ;;
    --ns|--namespace) NS="$2"; shift ;;
    --image) IMAGE="$2"; shift ;;
    --port) PORT="$2"; shift ;;
    --replicas) REPLICAS="$2"; shift ;;
    --storage) STORAGE="$2"; shift ;;
    --addons) ADDONS_FLAGS="$2"; shift ;;
    --hardened) HARDENED="true" ;;
    --apply) APPLY="true" ;;
    --dryrun) DRYRUN="true" ;;
    --create-service|--svc) CREATE_SERVICE="true" ;;
    --help|-h)
      echo "============================================================"
      echo "☸️ Universal Kubernetes YAML Generator v$VERSION — Help & Usage"
      echo "============================================================"
      echo ""
      echo "USAGE:"
      echo "  bash k8s-yaml-gen.sh [options]"
      echo ""
      echo "EXAMPLES:"
      echo "  bash k8s-yaml-gen.sh --mode production --resource deployment,service"
      echo "  bash k8s-yaml-gen.sh --hardened --addons 2,8 --app webapp"
      echo ""
      exit 0 ;;
    *) warn "⚠️ Unknown flag: $1" ;;
  esac
  shift
done

# --- Internet Check ---
if curl -sfI "$REPO_URL/production/workloads/deployment.yaml" >/dev/null 2>&1; then
  ONLINE=true; success "🌐 Online mode detected — templates fetched from GitHub."
else
  ONLINE=false; warn "⚠️ Offline mode — using cached templates."
fi

# --- Defaults ---
DEFAULT_MODE="minimal"
DEFAULT_APP="my-app"
DEFAULT_NS="default"
DEFAULT_IMAGE="nginx:latest"
DEFAULT_PORT="80"
DEFAULT_REPLICAS="1"
DEFAULT_STORAGE="1Gi"

# --- Interactive Mode ---
if [[ -z "$MODE" && -z "$RESOURCE" ]]; then
  echo "============================================"
  info " ☸️ Kubernetes YAML Generator $VERSION"
  echo "============================================"
  echo "Select generation mode:"
  echo "1) Minimal"
  echo "2) Production"
  echo "3) Hardened (includes security addons)"
  read -e -p "Your choice [1-3]: " mode_choice
  case "$mode_choice" in
    1) MODE="minimal" ;;
    2) MODE="production" ;;
    3) MODE="production"; HARDENED="true" ;;
    *) MODE="minimal" ;;
  esac
fi

# Prompt for App Settings (editable, interactive)
if [ -z "$APP" ]; then read -e -p "Enter application name [${DEFAULT_APP}]: " APP; APP=${APP:-$DEFAULT_APP}; fi
if [ -z "$NS" ]; then read -e -p "Enter namespace [${DEFAULT_NS}]: " NS; NS=${NS:-$DEFAULT_NS}; fi
if [ -z "$IMAGE" ]; then read -e -p "Enter container image [${DEFAULT_IMAGE}]: " IMAGE; IMAGE=${IMAGE:-$DEFAULT_IMAGE}; fi
if [ -z "$PORT" ]; then read -e -p "Enter container port [${DEFAULT_PORT}]: " PORT; PORT=${PORT:-$DEFAULT_PORT}; fi
if [ -z "$REPLICAS" ]; then read -e -p "Enter replica count [${DEFAULT_REPLICAS}]: " REPLICAS; REPLICAS=${REPLICAS:-$DEFAULT_REPLICAS}; fi
if [ -z "$STORAGE" ]; then read -e -p "Enter storage size [${DEFAULT_STORAGE}]: " STORAGE; STORAGE=${STORAGE:-$DEFAULT_STORAGE}; fi

# --- Resource Map ---
declare -A RES_MAP=(
  [deployment]="workloads/deployment.yaml"
  [service]="networking/service.yaml"
  [configmap]="config/configmap.yaml"
  [secret]="config/secret.yaml"
  [pvc]="storage/pvc.yaml"
  [hpa]="scaling/hpa.yaml"
  [role]="rbac/role.yaml"
  [rolebinding]="rbac/rolebinding.yaml"
  [namespace]="cluster/namespace.yaml"
  [istio]="istio/gateway.yaml"
  [istio-gateway]="istio/gateway.yaml"
  [istio-virtualservice]="istio/virtualservice.yaml"
  [istio-destinationrule]="istio/destinationrule.yaml"
)

# --- Resource Selection ---
if [ -z "$RESOURCE" ]; then
  echo ""
  echo "Select resource types (comma-separated):"
  echo "1) Deployment  2) Service  3) ConfigMap  4) Secret"
  echo "5) PVC  6) HPA  7) Role  8) RoleBinding"
  echo "9) Namespace  10) Istio (Gateway+VS+DR)"
  read -e -p "Your choice [1-10 or 1,2,3]: " RESOURCES
  IFS=',' read -ra RES_IDX <<< "$RESOURCES"
  RESOURCE_LIST=()
  for i in "${RES_IDX[@]}"; do
    case ${i// /} in
      1) RESOURCE_LIST+=("deployment") ;;
      2) RESOURCE_LIST+=("service") ;;
      3) RESOURCE_LIST+=("configmap") ;;
      4) RESOURCE_LIST+=("secret") ;;
      5) RESOURCE_LIST+=("pvc") ;;
      6) RESOURCE_LIST+=("hpa") ;;
      7) RESOURCE_LIST+=("role") ;;
      8) RESOURCE_LIST+=("rolebinding") ;;
      9) RESOURCE_LIST+=("namespace") ;;
      10) RESOURCE_LIST+=("istio") ;;
    esac
  done
else
  IFS=',' read -ra RESOURCE_LIST <<< "$RESOURCE"
fi

# --- Addons Prompt ---
if [ -z "$HARDENED" ]; then
  echo ""
  read -e -p "🛡️  Include hardened security addons (PDB, NetworkPolicy, Ingress, etc)? [y/N]: " include_addons
  case "$include_addons" in
    [yY][eE][sS]|[yY]) HARDENED="true" ;;
    *) HARDENED="false" ;;
  esac
fi

# --- Fetch Template ---
fetch_template() {
  local template="$1"
  local out="$2"
  local cache="$CACHE_DIR/$(basename "$template")"
  if [ "$ONLINE" = true ] && curl -sf --retry 3 "$REPO_URL/$MODE/$template" -o "$out"; then
    cp "$out" "$cache"; success "✅ Downloaded $template"
  elif [ -f "$cache" ]; then
    cp "$cache" "$out"; success "📦 Used cached: $(basename "$template")"
  else
    warn "⚠️ Missing: $template"
  fi
}

DEST_DIR="$OUT_DIR/$APP"
mkdir -p "$DEST_DIR"

# --- Generate Resources (individual files) ---
for RES in "${RESOURCE_LIST[@]}"; do
  path="${RES_MAP[$RES]}"
  [ -z "$path" ] && { warn "⚠️ Unknown resource: $RES"; continue; }
  OUT_FILE="$DEST_DIR/${APP}-${RES}.yaml"
  fetch_template "$path" "$OUT_FILE"
  sed -i \
    -e "s/{{APP_NAME}}/$APP/g" \
    -e "s/{{NAMESPACE}}/$NS/g" \
    -e "s/{{IMAGE}}/$IMAGE/g" \
    -e "s/{{PORT}}/$PORT/g" \
    -e "s/{{REPLICAS}}/$REPLICAS/g" \
    -e "s/{{STORAGE_SIZE}}/$STORAGE/g" \
    "$OUT_FILE"
  success "📄 Generated: $OUT_FILE"
done

# --- Hardened Addons (individual files) ---
if [ "$HARDENED" = "true" ]; then
  echo "--------------------------------------------"
  echo "Available Hardened Addons:"
  echo "1) PodDisruptionBudget"
  echo "2) NetworkPolicy"
  echo "3) TLS Ingress"
  echo "4) ResourceQuota"
  echo "5) ServiceMonitor"
  echo "6) Vault SecretProvider"
  echo "7) Istio mTLS"
  echo "8) Ingress (Custom NGINX Ingress with TLS)"
  if [ -z "$ADDONS_FLAGS" ]; then
    read -e -p "Select addons (comma-separated): " ADDONS_INPUT
  else
    ADDONS_INPUT="$ADDONS_FLAGS"
  fi
  IFS=',' read -ra ADDONS <<< "$ADDONS_INPUT"
  for addon in "${ADDONS[@]}"; do
    case ${addon// /} in
      1) addon_path="pdb.yaml" ;;
      2) addon_path="networkpolicy.yaml" ;;
      3) addon_path="tls-ingress.yaml" ;;
      4) addon_path="resourcequota.yaml" ;;
      5) addon_path="monitoring-servicemonitor.yaml" ;;
      6) addon_path="vault-secretprovider.yaml" ;;
      7) addon_path="istio-mtls.yaml" ;;
      8) addon_path="ingress.yaml" ;;
      *) continue ;;
    esac
    OUT_FILE="$DEST_DIR/${APP}-addon-${addon_path}"
    info "📦 Adding addon: $addon_path"
    if [ "$ONLINE" = true ] && curl -sf "$REPO_URL/addons/$addon_path" -o "$OUT_FILE"; then
      cp "$OUT_FILE" "$CACHE_DIR/$addon_path"
      success "✅ Added: $OUT_FILE"
    elif [ -f "$CACHE_DIR/$addon_path" ]; then
      cp "$CACHE_DIR/$addon_path" "$OUT_FILE"
      success "📦 Used cached addon: $OUT_FILE"
    fi
    sed -i \
      -e "s/{{APP_NAME}}/$APP/g" \
      -e "s/{{NAMESPACE}}/$NS/g" \
      -e "s/{{IMAGE}}/$IMAGE/g" \
      -e "s/{{PORT}}/$PORT/g" \
      "$OUT_FILE"
  done
fi

# --- Output ---
success "✅ YAMLs generated in: $DEST_DIR"
( command -v tree >/dev/null 2>&1 && tree "$DEST_DIR" ) || ls -1 "$DEST_DIR"

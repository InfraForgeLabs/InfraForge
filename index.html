<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚙️ InfraForge v1.0.0 — Coming Soon</title>
  <style>
    :root {
      --bg: #0d1117;
      --fg: #c9d1d9;
      --accent: #58a6ff;
      --muted: #8b949e;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    h1 {
      color: var(--accent);
      font-size: 2.4rem;
      margin-bottom: 0.4em;
    }
    h2 {
      font-weight: 500;
      margin-bottom: 0.8em;
    }
    p {
      font-size: 1.1rem;
      line-height: 1.6;
      max-width: 700px;
      color: var(--muted);
    }
    .divider {
      width: 100px;
      height: 2px;
      background: var(--accent);
      margin: 1.5rem 0;
      border-radius: 2px;
    }
    footer {
      margin-top: 2rem;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .flag {
      display: inline-block;
      font-size: 1.2em;
      margin-left: 4px;
    }
  </style>
</head>
<body>
  <h1>⚙️ InfraForge v1.0.0</h1>
  <h2>Unified DevSecOps Framework</h2>
  <div class="divider"></div>
  <p>
    The open-source infrastructure automation platform by <strong>InfraForgeLabs</strong>.<br><br>
    Official public domain launch on <strong>January 26, 2026</strong><span class="flag">🇮🇳</span><br><br>
    <em>Free · Local · Open · Forever</em>
  </p>
  <footer>© 2026 InfraForgeLabs</footer>
</body>
</html>

# ============================================================
# 🧩 Gitleaks Configuration Template
# Version: {{VERSION}}
# Description: Secrets detection configuration for {{APP_NAME}}
# ============================================================

title = "Gitleaks Configuration for {{APP_NAME}}"

[allowlist]
description = "Ignore test or example files"
regexTarget = "filename"
regex = ".*(test|example|sample|docs).*"

[[rules]]
id = "Generic API Key"
description = "Detects generic API keys"
regex = '''(?i)(api|token|key|secret)[\s:=]+[A-Za-z0-9_\-]{16,64}'''
tags = ["apikey", "generic"]

[[rules]]
id = "AWS Access Key"
description = "Detects AWS Access Key IDs"
regex = '''AKIA[0-9A-Z]{16}'''
tags = ["aws", "credentials"]

[[rules]]
id = "Private Key"
description = "Detects private keys"
regex = '''-----BEGIN( RSA)? PRIVATE KEY-----'''
tags = ["crypto", "credentials"]

[report]
path = "reports/{{APP_NAME}}-gitleaks-report.json"
format = "json"

[metadata]
project = "{{APP_NAME}}"
generated_on = "{{DATE}}"
version = "{{VERSION}}"
